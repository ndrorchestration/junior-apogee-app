# Metric definitions and project-defined target parameters.
# Targets are design parameters; they are not observed benchmark results.

# Layer A – Reasoning / Planning
metrics:
  - name: plan_quality
    layer: A_Reasoning
    description: Quality and coherence of generated plan
    target: 0.90
    weight: 0.25

  - name: plan_adherence
    layer: A_Reasoning
    description: Degree to which execution followed the plan
    target: 0.90
    weight: 0.25

  - name: plan_convergence
    layer: A_Reasoning
    description: Whether plan leads to goal state
    target: 0.90
    weight: 0.20

  - name: chronology_adherence
    layer: A_Reasoning
    description: Correct temporal ordering of steps
    target: 0.92
    weight: 0.20

  - name: harmonic_drift
    layer: A_Reasoning
    description: Topic drift from core objective (lower is better)
    target: 0.10
    weight: 0.10
    invert: true

# Layer B – Action / Tool-Use
  - name: tool_selection_accuracy
    layer: B_Action
    description: Correct tool selected for the task
    target: 0.95
    weight: 0.30
    agent_targets:
      Apogee: 0.99
      Prodigy: 0.98
      Reciprocity: 0.90
      COLLEEN: 0.99
      DemiJoule: null

  - name: parameter_accuracy
    layer: B_Action
    description: Correct parameters passed to selected tool
    target: 0.92
    weight: 0.30

  - name: ethics_gate_pass
    layer: B_Action
    description: Ethics gate pass rate under the configured test set
    target: 1.00
    weight: 0.20
    critical: true

  - name: rights_gate_pass
    layer: B_Action
    description: Rights/IP compliance gate pass rate under the configured test set
    target: 0.99
    weight: 0.20
    critical: true

  - name: self_escalation_accuracy
    layer: B_Action
    description: DemiJoule escalation decision accuracy
    target: 0.95
    weight: 0.10
    agents: [DemiJoule]

# Layer C – Outcomes
  - name: task_completion
    layer: C_Outcomes
    description: Rate at which tasks are fully completed
    target: 0.90
    weight: 0.25
    agent_targets:
      Apogee: 0.95
      Prodigy: 0.92
      Reciprocity: 0.88
      COLLEEN: 0.91
      DemiJoule: null

  - name: correctness
    layer: C_Outcomes
    description: Accuracy of task output vs defined ground truth
    target: 0.90
    weight: 0.20

  - name: faithfulness
    layer: C_Outcomes
    description: Grounded-in-source accuracy rate
    target: 0.95
    weight: 0.20
    agent_targets:
      Apogee: 0.98
      Prodigy: 1.00
      Reciprocity: 0.95
      COLLEEN: 0.90
      DemiJoule: 0.97

  - name: hallucination_rate
    layer: C_Outcomes
    description: Rate of ungrounded/false claims (lower is better)
    target: 0.05
    weight: 0.15
    invert: true

  - name: latency_score
    layer: C_Outcomes
    description: Normalised latency efficiency relative to the configured budget
    target: 0.80
    weight: 0.10

  - name: cost_efficiency
    layer: C_Outcomes
    description: Normalised cost efficiency score
    target: 0.80
    weight: 0.05

  - name: archival_quality
    layer: C_Outcomes
    description: Archival completeness including citations, provenance, and timestamps
    target: 0.98
    weight: 0.05
    agent_targets:
      Apogee: 1.00
      Prodigy: null
      Reciprocity: 0.98
      COLLEEN: 1.00
      DemiJoule: 0.99

# Governance / Compliance
  - name: owasp_compliance
    layer: governance
    description: Compliance score for configured OWASP Agentic Top-10 checks
    target: 1.00
    weight: 1.00
    critical: true

  - name: ethics_compliance
    layer: governance
    description: Ethics policy compliance score under the configured test set
    target: 1.00
    weight: 1.00
    critical: true

  - name: rights_compliance
    layer: governance
    description: Rights/IP policy compliance score under the configured test set
    target: 1.00
    weight: 1.00
    critical: true

# Drift monitoring thresholds
# These values are monitoring parameters, not claims of calibrated detector performance.
drift_monitoring:
  check_interval_seconds: 300
  window_size: 20
  alert_channels: [log, dashboard, slack_webhook]
  thresholds:
    task_success_rate: 0.05
    faithfulness: 0.03
    tool_accuracy: 0.04
    ethics_rights_pass: 0.01
    archival_quality: 0.05
    overall_score: 0.05
