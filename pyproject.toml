[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "junior-apogee-app"
version = "0.1.0b0"
description = "Experimental evidence-native AI evaluation and QA workbench"
authors = [{ name = "Ndr / Ender Hensel" }]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=0.21.0",
    "requests>=2.31.0",
    "anthropic>=0.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "prometheus-client>=0.24.0",
    "mypy>=1.4.0",
    "types-requests>=2.31.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

# Legacy distribution/import identifiers are retained temporarily for compatibility.
# They are not the current product name and will be migrated after final brand selection.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"junior_apogee" = ["config/*.yaml", "config/*.yml", "py.typed"]

[project.scripts]
# Legacy command retained for compatibility pending the final technical rename.
junior-apogee = "junior_apogee.cli:cli"
# Older compatibility shim; remove as part of the eventual package-identity migration.
junior-apogee-app = "junior_apogee_app.__init__:main"

[tool.black]
line-length = 88

# Scope isort to the current src package during compatibility cleanup.
[tool.isort]
profile = "black"
known_first_party = ["junior_apogee"]
skip = ["junior_apogee_app"]

[tool.setuptools]
package-dir = { "" = "src" }
